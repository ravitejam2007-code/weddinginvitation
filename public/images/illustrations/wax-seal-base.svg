<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="waxRed" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#c9254c"/>
      <stop offset="42%" stop-color="#931333"/>
      <stop offset="78%" stop-color="#690a21"/>
      <stop offset="100%" stop-color="#460414"/>
    </radialGradient>
    <radialGradient id="recessRed" cx="40%" cy="36%" r="68%">
      <stop offset="0%" stop-color="#ab193c"/>
      <stop offset="70%" stop-color="#7e0e29"/>
      <stop offset="100%" stop-color="#54081b"/>
    </radialGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5d0"/>
      <stop offset="30%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#997722"/>
      <stop offset="100%" stop-color="#f5e0a0"/>
    </linearGradient>
    <filter id="waxShadow" x="-25%" y="-20%" width="150%" height="155%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#36030e" flood-opacity=".38"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity=".2"/>
    </filter>
  </defs>

  <!-- Organic sculpted wax seal body with melted drips -->
  <path d="M50 3.5 c13 -1 24 4.5 33 13.5 s14 21.5 14 34 -5.5 25.5 -14.5 34.5 -20.5 13 -33 12 -24.5 -4 -33.5 -13.5 S3.5 62.5 3.5 50 8.5 25.5 17.5 16.5 37.5 3.5 50 3.5 Z" fill="url(#waxRed)" filter="url(#waxShadow)"/>

  <!-- Ornate outer gold ring -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="url(#goldRim)" stroke-width="1.8" stroke-opacity=".9"/>
  <circle cx="50" cy="50" r="39.2" fill="none" stroke="#ffeaa7" stroke-width="0.6" stroke-opacity=".6" stroke-dasharray="2 1.5"/>

  <!-- Inner recessed chamber -->
  <circle cx="50" cy="50" r="34" fill="url(#recessRed)" stroke="#450413" stroke-width="1.2"/>
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#goldRim)" stroke-width="0.8" stroke-opacity=".75"/>

  <!-- Specular top highlight curve -->
  <path d="M21 24 c12 -12 30 -16 45 -9" fill="none" stroke="#ffb3c1" stroke-opacity=".45" stroke-width="2.2" stroke-linecap="round"/>
</svg>
